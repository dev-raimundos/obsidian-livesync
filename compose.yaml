services:
  couchdb:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER:?Defina COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Defina COUCHDB_PASSWORD}
    ports:
      - "${COUCHDB_BIND_ADDRESS:-0.0.0.0}:${COUCHDB_PORT:-5984}:5984"
    expose:
      - "5984"
    volumes:
      - couchdb-data:/opt/couchdb/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS --max-time 4 --user "$${COUCHDB_USER}:$${COUCHDB_PASSWORD}"
          http://127.0.0.1:5984/_session | grep -q '"_admin"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  couchdb-init:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    restart: "on-failure:5"
    entrypoint: ["/bin/sh", "/usr/local/bin/livesync-init.sh"]
    # Compartilha a rede do banco para não depender de DNS entre containers.
    network_mode: service:couchdb
    depends_on:
      couchdb:
        condition: service_healthy
    environment:
      COUCHDB_USER: ${COUCHDB_USER:?Defina COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Defina COUCHDB_PASSWORD}
      COUCHDB_DATABASE: ${COUCHDB_DATABASE:-obsidiannotes}

volumes:
  couchdb-data:
